{% extends 'base.html' %}

{% block title %}Confirm Delete Course - LMS{% endblock %}

{% block content %}
<div class="container my-4" style="max-width: 500px;">
    <div class="card shadow border-0">
        <div class="card-header bg-danger text-white py-3">
            <h4 class="mb-0"><i class="fas fa-exclamation-triangle me-2"></i>Delete Course</h4>
        </div>
        <div class="card-body p-4 text-center">
            <p class="fs-5">Are you sure you want to delete the course <strong>"{{ course.name }}"</strong>?</p>
            <p class="text-danger small">This action will also delete all units associated with this course.</p>
            <form method="post" class="mt-4">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'course_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4"><i class="fas fa-trash-alt me-1"></i> Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
